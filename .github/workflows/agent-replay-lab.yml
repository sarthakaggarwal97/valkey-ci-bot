name: CI Agent Replay Lab

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Acceptance/replay manifest path."
        required: false
        default: "examples/valkey-acceptance.yml"
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CLAUDE_CODE_USE_BEDROCK: "1"
  CI_AGENT_EVIDENCE_DIR: agent-evidence

jobs:
  replay-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out agent repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Check out agent data snapshots
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: bot-data
          path: bot-data
          persist-credentials: false
          fetch-depth: 1

      - name: Run replay lab
        shell: bash
        env:
          REPLAY_MANIFEST: ${{ github.event.inputs.manifest || 'examples/valkey-acceptance.yml' }}
          REPLAY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${REPLAY_MANIFEST}" == /* || "${REPLAY_MANIFEST}" == *..* || "${REPLAY_MANIFEST}" == -* ]]; then
            echo "Invalid replay manifest path: ${REPLAY_MANIFEST}" >&2
            exit 1
          fi
          args=(
            -m scripts.valkey_acceptance
            --manifest "${REPLAY_MANIFEST}"
            --token "${REPLAY_TOKEN}"
            --aws-region "${AWS_REGION}"
            --output acceptance-report.md
            --json-output acceptance-report.json
          )

          python3 "${args[@]}"

      - name: Publish replay report to summary
        shell: bash
        run: cat acceptance-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate observability site
        shell: bash
        run: |
          python3 -m scripts.agent_dashboard \
            --failure-store bot-data/failure-store.json \
            --rate-state bot-data/rate-state.json \
            --monitor-state bot-data/monitor-state.json \
            --review-state bot-data/review-state.json \
            --event-log bot-data/agent-events.jsonl \
            --acceptance-result acceptance-report.json \
            --output-markdown agent-dashboard.md \
            --output-json agent-dashboard.json \
            --output-html agent-dashboard.html

          python3 -m scripts.agent_dashboard_site \
            --dashboard-json agent-dashboard.json \
            --site-dir dashboard-site

      - name: Upload replay lab artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-agent-replay-lab-${{ github.run_id }}
          path: |
            acceptance-report.md
            acceptance-report.json
            agent-dashboard.md
            agent-dashboard.json
            agent-dashboard.html
            dashboard-site
          retention-days: 30

      - name: Upload agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-lab-agent-evidence-${{ github.run_id }}
          path: agent-evidence
          if-no-files-found: ignore
          retention-days: 30
