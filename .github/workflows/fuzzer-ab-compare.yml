name: Fuzzer A/B Compare

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Comma-separated fuzzer run IDs to compare"
        required: true
        type: string
      repo:
        description: "Target fuzzer repo"
        required: false
        type: string
        default: "valkey-io/valkey-fuzzer"

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CLAUDE_CODE_USE_BEDROCK: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Resolve token
        id: token
        shell: bash
        env:
          VALKEY_GITHUB_TOKEN: ${{ secrets.VALKEY_GITHUB_TOKEN }}
        run: echo "token=${VALKEY_GITHUB_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: fuzzer-ab-compare-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run A/B comparison
        env:
          TARGET_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          python -m scripts.fuzzer_ab_compare \
            --runs "${{ inputs.runs }}" \
            --repo "${{ inputs.repo }}" \
            --target-token "${TARGET_TOKEN}" \
            --aws-region "${AWS_REGION}" \
            2>&1 | tee ab-compare-result.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzer-ab-compare-${{ github.run_id }}
          path: ab-compare-result.txt
          retention-days: 14
